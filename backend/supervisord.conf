[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Local Redis inside the container: free, unlimited commands, sub-millisecond.
; Used when REDIS_URL is not set (or set to redis://localhost:6379).
; If REDIS_URL points to Upstash, this still runs but is simply unused.
[program:redis]
command=redis-server --port 6379 --bind 127.0.0.1 --dir /tmp --save "" --appendonly no --maxmemory 300mb --maxmemory-policy noeviction
priority=1
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Transcription workers (conversation turns first, then normal submissions).
[program:transcribe-worker]
command=python worker.py transcribe_priority transcribe
process_name=%(program_name)s_%(process_num)02d
numprocs=3
priority=10
autostart=true
autorestart=true
startretries=50
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Grading workers. They wait for free AI capacity, so a few are enough.
[program:grade-worker]
command=python worker.py grade
process_name=%(program_name)s_%(process_num)02d
numprocs=4
priority=10
autostart=true
autorestart=true
startretries=50
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fastapi]
command=python main.py
priority=20
autostart=true
autorestart=true
startretries=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
